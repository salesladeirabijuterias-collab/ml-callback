<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorização Mercado Livre</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222}
 code{display:block;background:#f3f3f3;padding:14px;border-radius:8px;word-break:break-all;font-size:15px}
 button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#3483fa;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<h2>Autorização concluída</h2>
<p id="msg">Copie o código abaixo e cole na janela do autenticar.bat:</p>
<code id="cod">—</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('cod').textContent);this.textContent='Copiado!'">Copiar código</button>
<script>
 const c=new URLSearchParams(location.search).get('code');
 if(c){document.getElementById('cod').textContent=c}
 else{document.getElementById('msg').textContent='Nenhum código encontrado nesta página.'}
</script>
</body>
</html>
